services:
  myvectors:
    build: .
    ports:
      - "127.0.0.1:42002:42002"
    environment:
      MYVECTORS_DB: /data/myvectors.sqlite3
      DEVICE42_URL: ${DEVICE42_URL:-https://device42.example.internal}
      D42_VERIFY_TLS: "true"
    volumes:
      - myvectors-data:/data
    restart: unless-stopped
volumes:
  myvectors-data:
